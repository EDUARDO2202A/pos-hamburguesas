<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>De la 40</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<!-- Notificación emergente flotante (Toast) -->
    <div id="toast-notification" class="toast hidden"></div>
    <!-- Pestañas principales -->
    <nav class="top-tabs">
        <button type="button" id="tab-vender" class="tab-btn active">➕ Nuevo pedido</button>
        <button type="button" id="tab-pendientes" class="tab-btn">
            📋 Pendientes <span id="badge-pendientes" class="tab-badge zero">0</span>
        </button>
        <button type="button" id="tab-ventas" class="tab-btn">📊 Ventas</button>
    </nav>

    <!-- VISTA 1: Agregar pedidos -->
    <div id="view-vender" class="app-container">

        <!-- Panel Izquierdo: Menú Ágil -->
        <main class="menu-section">
            <h2 class="category-title">Perritos 🌭</h2>
            <div class="btn-grid">
                <button class="btn-product item-hotdog" data-name="Perrito Sencillo" data-price="12">Sencillo<br><span>$12</span></button>
                <button class="btn-product item-hotdog" data-name="Perrito Especial" data-price="25">Especial<br><span>$25</span></button>
            </div>

            <h2 class="category-title">Hamburguesas 🍔</h2>
            <div class="btn-grid">
                <button class="btn-product item-burger" data-name="Burger Sencilla" data-price="45">Sencilla<br><span>$45</span></button>
                <button class="btn-product item-burger" data-name="Burger Especial" data-price="50">Especial<br><span>$50</span></button>
                <button class="btn-product item-burger" data-name="Burger Súper" data-price="60">Súper<br><span>$60</span></button>
                <button class="btn-product item-burger" data-name="Burger Extra" data-price="70">Extra<br><span>$70</span></button>
                <button class="btn-product item-burger" data-name="Burger Hawaiana" data-price="60">Hawaiana<br><span>$60</span></button>
            </div>

            <h2 class="category-title">Tortas y Tacos 🌮</h2>
            <div class="btn-grid">
                <button class="btn-product item-torta" data-name="Torta Carnitas" data-price="40">Torta Carnitas<br><span>$40</span></button>
                <button class="btn-product item-torta" data-name="Torta Jamón/Queso" data-price="35">Torta Jamón<br><span>$35</span></button>
                <button class="btn-product item-torta" data-name="Tacos Carnitas" data-price="20">Tacos<br><span>$20</span></button>
                <!-- Botón de carnitas modificado para venta a granel -->
                <button class="btn-product item-torta" data-name="Carnitas" data-price="350" data-type="granel">Carnitas (Menudeo)<br><span>Por peso</span></button>
            </div>
        </main>

        <!-- Panel Derecho: Ticket de Cobro -->
        <aside class="ticket-section">
            <div class="ticket-header">
                <h2>Orden Actual</h2>
                <!-- Campo para nombre del cliente -->
                <input type="text" id="nombre-cliente" class="input-cliente" placeholder="👤 Nombre del cliente (opcional)..." autocomplete="off">
            </div>

            <ul id="ticket-list" class="ticket-list">
                <li class="empty-msg">Toca un producto para empezar</li>
            </ul>

            <div class="ticket-footer">
                <div class="total-row">Total: $<span id="total-price">0.00</span></div>
                <button class="btn-pay" id="btn-cobrar">COBRAR Y GUARDAR</button>
            </div>
        </aside>

    </div>

    <!-- VISTA 2: Pedidos pendientes -->
    <section id="view-pedidos" class="pedidos-section hidden">
        <div class="pedidos-top">
            <h2>Pedidos por hacer</h2>
            <button type="button" id="btn-volver" class="btn-volver">⬅ Volver a agregar pedidos</button>
        </div>
        <div id="pedidos-grid" class="pedidos-grid"></div>
        <p id="sin-pendientes" class="sin-pendientes hidden">🎉 No hay pedidos pendientes</p>
    </section>

    <!-- VISTA 3: Registro de ventas (día / semana / mes) -->
    <section id="view-ventas" class="pedidos-section ventas-section hidden">
        <h2 class="ventas-titulo">Registro de ventas</h2>

        <!-- ¿De qué periodo quieres ver las ventas? -->
        <div class="periodo-tabs">
            <button type="button" class="periodo-btn active" data-periodo="dia">📅 Por día</button>
            <button type="button" class="periodo-btn" data-periodo="semana">🗓️ Por semana</button>
            <button type="button" class="periodo-btn" data-periodo="mes">📆 Por mes</button>
        </div>

        <!-- Moverse entre fechas -->
        <div class="fecha-nav">
            <button type="button" id="ventas-anterior" class="btn-nav" aria-label="Anterior">◀</button>
            <div class="fecha-centro">
                <div id="ventas-rango" class="ventas-rango">Hoy</div>
                <input type="date" id="ventas-fecha" class="input-fecha">
            </div>
            <button type="button" id="ventas-siguiente" class="btn-nav" aria-label="Siguiente">▶</button>
            <button type="button" id="ventas-hoy" class="btn-hoy">Ir a hoy</button>
        </div>

        <!-- Resumen escrito en palabras sencillas -->
        <div id="ventas-resumen" class="resumen-texto"></div>

        <!-- Subir a la nube -->
        <div class="nube-card">
            <p id="nube-estado" class="nube-estado"></p>
            <button type="button" id="btn-subir-nube" class="btn-nube">☁️ Subir ventas de hoy</button>
        </div>

        <!-- Tablas -->
        <div id="ventas-detalle" class="hidden">
            <h3 class="ventas-subtitulo">¿Qué se vendió?</h3>
            <div id="tabla-productos" class="tabla-wrap"></div>

            <h3 id="titulo-detalle" class="ventas-subtitulo">Pedidos del día</h3>
            <div id="tabla-detalle" class="tabla-wrap"></div>
        </div>
    </section>

    <!-- Modal 1: Modal Normal para Cantidad y Mañosidades -->
    <div id="modal-notas" class="modal-overlay hidden">
        <button type="button" id="btn-close-modal-1" class="btn-close-modal" aria-label="Cerrar">✕</button>
        <div class="modal-content">
            <h3 id="modal-product-name">Producto</h3>

            <div class="qty-box">
                <label>Cantidad total:</label>
                <div class="qty-controls">
                    <button type="button" id="btn-qty-minus" class="btn-qty">-</button>
                    <span id="modal-qty-val">1</span>
                    <button type="button" id="btn-qty-plus" class="btn-qty">+</button>
                </div>
            </div>

            <div class="quick-qty-row">
                <button type="button" class="btn-quick-qty" data-add="2">+2</button>
                <button type="button" class="btn-quick-qty" data-add="3">+3</button>
                <button type="button" class="btn-quick-qty" data-add="5">+5</button>
                <button type="button" class="btn-quick-qty" data-set="1">Reset (1)</button>
            </div>

            <hr class="modal-divider">

            <div class="notes-header">
                <span>¿Alguna modificación?</span>
                <div id="split-box" class="split-box hidden">
                    <label>¿A cuántos?</label>
                    <button type="button" id="btn-split-minus" class="btn-qty-sm">-</button>
                    <span id="modal-split-val">1</span>
                    <button type="button" id="btn-split-plus" class="btn-qty-sm">+</button>
                </div>
            </div>

            <div class="btn-grid-notes">
                <button type="button" class="btn-note">Sin Cebolla</button>
                <button type="button" class="btn-note">Sin picante</button>
                <button type="button" class="btn-note">Sin Verdura</button>
                <button type="button" class="btn-note">Solo Catsup/Mayonesa</button>
                <button type="button" class="btn-note">Sin ensalada</button>
                <button type="button" class="btn-note">Pan y salchicha</button>
            </div>
            <input type="text" id="custom-note" placeholder="Otra nota (opcional)..." class="input-note">

            <div class="modal-actions">
                <button type="button" id="btn-cancel-modal" class="btn-danger">Cancelar</button>
                <button type="button" id="btn-save-note" class="btn-success">Agregar al Ticket</button>
            </div>
        </div>
    </div>

   <!-- Modal 2: Venta a Granel (Por Peso) -->
    <div id="modal-granel" class="modal-overlay hidden">
        <button type="button" id="btn-close-modal-2" class="btn-close-modal" aria-label="Cerrar">✕</button>
        <div class="modal-content">
            <h3 id="modal-granel-name">Carnitas a Granel</h3>

            <div class="granel-box">
                <label>¿De a cuánto? ($ Pesos)</label>
                <div class="granel-input-group">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="input-granel-pesos" value="70" min="10" step="10" inputmode="numeric">
                </div>

                <!-- Botones táctiles de monto rápido -->
                <div class="granel-quick-presets">
                    <button type="button" class="btn-preset" data-val="50">70$</button>
                    <button type="button" class="btn-preset" data-val="70">$80</button>
                    <button type="button" class="btn-preset" data-val="100">$100</button>
                    <button type="button" class="btn-preset" data-val="150">$150</button>
                    <button type="button" class="btn-preset" data-val="200">$200</button>
                    <button type="button" class="btn-preset btn-add-preset" data-add="5">añadir$5</button>
                </div>
            </div>

            <div class="gramos-result">
                <span>Equivale aprox. a:</span>
                <strong id="granel-gramos">200g</strong>
            </div>

            <hr class="modal-divider">
            <input type="text" id="custom-note-granel" placeholder="Alguna nota (opcional)..." class="input-note">

            <div class="modal-actions">
                <button type="button" id="btn-cancel-granel" class="btn-danger">Cancelar</button>
                <button type="button" id="btn-save-granel" class="btn-success">Agregar al Ticket</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <script src="app.js"></script>
</body>
</html>
